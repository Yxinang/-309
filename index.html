<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室座位圖設計工具 (Classroom Seating Planner)</title>
    <!-- 引入 Tailwind CSS 與 html2canvas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        }
        .student-chip {
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .student-chip:active {
            cursor: grabbing;
        }
        .seat-slot {
            transition: all 0.2s ease;
        }
        .seat-slot.drag-over {
            background-color: #bfdbfe;
            border-color: #3b82f6;
            transform: scale(1.03);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 text-white shadow px-6 py-3 flex justify-between items-center">
        <h1 class="text-lg font-bold flex items-center gap-2">
            🏫 教室座位圖設計工具 (中文字型鎖定・永不遺失)
        </h1>
        <div class="flex gap-2">
            <button onclick="saveManual()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded text-xs font-medium flex items-center gap-1 shadow transition">
                💾 儲存目前狀態
            </button>
            <button onclick="autoAssign()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-xs font-medium flex items-center gap-1 shadow transition">
                ⚡ 自動排入座位
            </button>
            <button onclick="clearSeats()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded text-xs font-medium flex items-center gap-1 shadow transition">
                🔄 清空座位
            </button>
            <button onclick="exportImage()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded text-xs font-medium flex items-center gap-1 shadow transition">
                📥 匯出圖片
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- 左側控制與學生待命區 -->
        <aside class="w-96 bg-white border-r border-slate-200 flex flex-col p-4 gap-4 overflow-y-auto shadow-sm">
            
            <!-- 步驟 1：導師桌設定 -->
            <div class="border border-slate-200 rounded-lg p-3 bg-slate-50">
                <h2 class="font-bold text-slate-700 text-sm mb-2">1. 導師桌位置</h2>
                <div class="flex items-center gap-2">
                    <div id="teacher-seat" class="bg-amber-200 border-2 border-amber-500 rounded p-2 text-center text-xs font-bold w-28 shadow-sm cursor-move">
                        👨‍🏫 導師桌 (可拖曳)
                    </div>
                    <span class="text-xs text-slate-500">可在畫布任意拖曳</span>
                </div>
            </div>

            <!-- 步驟 2：學生人數與排版說明 -->
            <div class="border border-slate-200 rounded-lg p-3 bg-slate-50">
                <h2 class="font-bold text-slate-700 text-sm mb-2">2. 設定學生人數與名單</h2>
                <div class="flex items-center gap-2 mb-2">
                    <label class="text-xs text-slate-600">學生總人數：</label>
                    <input type="number" id="student-count" min="1" max="40" value="25" onchange="updateStudentCount()" class="w-16 border border-slate-300 rounded px-2 py-1 text-sm text-center">
                </div>
                <p class="text-[11px] text-slate-500">規畫：講台右側特設 1 個獨立座位，後方 24 位採橫排 6 個（兩兩並列 2-2-2，共 4 排）。已修復字型編碼，名字不會變亂碼或消失！</p>
            </div>

            <!-- 步驟 3：學生資訊與待命區 -->
            <div class="border border-slate-200 rounded-lg p-3 bg-slate-50 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-700 text-sm">3. 學生資訊清單（可拖曳入座位）</h2>
                    <span id="unassigned-count" class="text-xs bg-blue-100 text-blue-700 font-semibold px-2 py-0.5 rounded-full">未入座: 0</span>
                </div>
                <p class="text-[11px] text-slate-500 mb-2">直接修改姓名、性別，或將卡片拖曳至右側座位：</p>
                
                <!-- 待命學生卡片容器 -->
                <div id="student-pool" class="flex flex-col gap-1.5 overflow-y-auto flex-1 max-h-96 pr-1 border border-dashed border-slate-300 p-2 rounded bg-white" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToPool(event)">
                    <!-- 動態生成學生 -->
                </div>
            </div>

        </aside>

        <!-- 右側互動畫布區 -->
        <main class="flex-1 p-6 flex flex-col items-center justify-center overflow-auto relative">
            
            <!-- 教室畫布外框 -->
            <div id="classroom-canvas" class="w-[1020px] h-[780px] bg-amber-50/70 border-4 border-slate-700 rounded-xl relative shadow-2xl overflow-hidden flex flex-col items-center pt-8 px-8 pb-8">
                
                <!-- 黑板 -->
                <div class="w-3/5 h-12 bg-slate-800 border-4 border-amber-900 rounded flex items-center justify-center text-white font-bold shadow-md tracking-widest text-sm mb-4">
                    黑 板 (Whiteboard)
                </div>

                <!-- 講台與講台右側特別座位區 -->
                <div class="w-full flex justify-center items-center gap-8 mb-6 px-8 relative">
                    <!-- 左側平衡空間佔位 -->
                    <div class="w-24"></div>

                    <!-- 中間講台 -->
                    <div class="w-40 h-8 bg-amber-800 rounded shadow flex items-center justify-center text-white text-xs font-semibold">
                        講台
                    </div>

                    <!-- 右側講台旁特別座位 (Seat 1) -->
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-amber-800 font-bold mb-1">講台右側座位</span>
                        <div id="front-special-seat-container">
                            <!-- 動態填入 Seat 1 -->
                        </div>
                    </div>
                </div>

                <!-- 導師桌（畫布內可自由拖曳） -->
                <div id="canvas-teacher" class="absolute bg-amber-200 border-2 border-amber-500 rounded-lg p-2 text-center shadow-md w-32 cursor-move z-20" style="top: 130px; left: 60px;">
                    <div class="text-xs font-bold text-amber-900">👨‍🏫 導師桌</div>
                </div>

                <!-- 後方 24 位座位矩陣容器 -->
                <div id="seats-grid" class="flex flex-col gap-3 items-center relative z-10 w-full px-6">
                    <!-- 後方 24 個座位生成於此 -->
                </div>

            </div>
        </main>
    </div>

    <!-- 程式邏輯 -->
    <script>
        const defaultStudents = [
            { id: 1, name: "黃琨翔", gender: "男" },
            { id: 2, name: "陳秉軒", gender: "男" },
            { id: 3, name: "杜晨翔", gender: "男" },
            { id: 4, name: "劉景碩", gender: "男" },
            { id: 5, name: "王宇童", gender: "男" },
            { id: 6, name: "吳立翔", gender: "男" },
            { id: 7, name: "陳宇恩", gender: "男" },
            { id: 8, name: "林楷諾", gender: "男" },
            { id: 9, name: "李柏衡", gender: "男" },
            { id: 10, name: "林晉翰", gender: "男" },
            { id: 11, name: "徐堉綸", gender: "男" },
            { id: 12, name: "紀孟希", gender: "男" },
            { id: 13, name: "徐晟瀚", gender: "男" },
            { id: 14, name: "王知言", gender: "女" },
            { id: 15, name: "蔡沛穎", gender: "女" },
            { id: 16, name: "鄭詠心", gender: "女" },
            { id: 17, name: "郭聿芸", gender: "女" },
            { id: 18, name: "楊茲甯", gender: "女" },
            { id: 19, name: "王岑芝", gender: "女" },
            { id: 20, name: "吳涵儒", gender: "女" },
            { id: 21, name: "洪楀晴", gender: "女" },
            { id: 22, name: "林芷萱", gender: "女" },
            { id: 23, name: "潘若穎", gender: "女" },
            { id: 24, name: "焉語霓", gender: "女" },
            { id: 25, name: "蘇唯心", gender: "女" }
        ];

        let students = [];
        let seatingAssignments = {};
        let teacherPos = { top: 130, left: 60 };

        function loadFromLocalStorage() {
            try {
                const savedStudents = localStorage.getItem('seating_students_v4');
                const savedAssignments = localStorage.getItem('seating_assignments_v4');
                const savedTeacherPos = localStorage.getItem('seating_teacher_pos_v4');

                if (savedStudents) {
                    students = JSON.parse(savedStudents);
                } else {
                    students = JSON.parse(JSON.stringify(defaultStudents));
                }

                if (savedAssignments) {
                    seatingAssignments = JSON.parse(savedAssignments);
                } else {
                    initAssignments();
                }

                if (savedTeacherPos) {
                    teacherPos = JSON.parse(savedTeacherPos);
                    const teacherEl = document.getElementById('canvas-teacher');
                    teacherEl.style.top = teacherPos.top + 'px';
                    teacherEl.style.left = teacherPos.left + 'px';
                }
            } catch (e) {
                students = JSON.parse(JSON.stringify(defaultStudents));
                initAssignments();
            }

            document.getElementById('student-count').value = students.length;
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('seating_students_v4', JSON.stringify(students));
                localStorage.setItem('seating_assignments_v4', JSON.stringify(seatingAssignments));
                localStorage.setItem('seating_teacher_pos_v4', JSON.stringify(teacherPos));
            } catch (e) {
                console.warn('LocalStorage 儲存受限');
            }
        }

        function saveManual() {
            saveToLocalStorage();
            alert('已成功儲存目前的座位與學生狀態！');
        }

        function initApp() {
            loadFromLocalStorage();
            if (!seatingAssignments || Object.keys(seatingAssignments).length === 0) {
                initAssignments();
            }
            renderAll();
        }

        function initAssignments() {
            seatingAssignments = {};
            students.forEach((s, idx) => {
                seatingAssignments[`seat-${idx + 1}`] = s.id;
            });
            saveToLocalStorage();
        }

        function updateStudentCount() {
            const targetCount = parseInt(document.getElementById('student-count').value) || 25;
            if (targetCount > students.length) {
                for (let i = students.length + 1; i <= targetCount; i++) {
                    students.push({ id: i, name: `學生${i}`, gender: i <= 13 ? '男' : '女' });
                }
            } else if (targetCount < students.length) {
                students = students.slice(0, targetCount);
            }
            initAssignments();
            renderAll();
        }

        function updateStudentInfo(id, field, value) {
            const s = students.find(item => item.id === id);
            if (s) {
                s[field] = value;
                saveToLocalStorage();
                renderAll();
            }
        }

        function renderAll() {
            renderStudentPool();
            renderSpecialSeat();
            renderSeatsGrid();
            updateUnassignedCount();
        }

        function renderStudentPool() {
            const poolEl = document.getElementById('student-pool');
            poolEl.innerHTML = '';

            const assignedIds = Object.values(seatingAssignments).filter(id => id !== null);
            const unassignedStudents = students.filter(s => !assignedIds.includes(s.id));

            if (unassignedStudents.length === 0) {
                poolEl.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">所有學生皆已入座 🎉</div>`;
                return;
            }

            unassignedStudents.forEach(s => {
                const card = document.createElement('div');
                card.className = `student-chip bg-white border border-slate-300 rounded p-1.5 flex items-center justify-between text-xs shadow-sm hover:border-blue-400`;
                card.draggable = true;
                card.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', s.id);
                };

                const genderColor = s.gender === '男' ? 'text-blue-600' : 'text-rose-600';

                card.innerHTML = `
                    <div class="flex items-center gap-1.5 flex-1">
                        <span class="font-bold text-slate-400 w-6">#${s.id}</span>
                        <input type="text" value="${s.name}" onclick="event.stopPropagation()" oninput="updateStudentInfo(${s.id}, 'name', this.value)" class="border rounded px-1 py-0.5 w-20 text-xs">
                        <select onclick="event.stopPropagation()" onchange="updateStudentInfo(${s.id}, 'gender', this.value)" class="border rounded px-1 py-0.5 text-xs ${genderColor}">
                            <option value="男" ${s.gender === '男' ? 'selected' : ''}>男</option>
                            <option value="女" ${s.gender === '女' ? 'selected' : ''}>女</option>
                        </select>
                    </div>
                    <span class="text-slate-400 text-[10px] cursor-grab">⠿</span>
                `;
                poolEl.appendChild(card);
            });
        }

        function updateUnassignedCount() {
            const assignedIds = Object.values(seatingAssignments).filter(id => id !== null);
            const unassignedCount = students.length - assignedIds.length;
            document.getElementById('unassigned-count').innerText = `未入座: ${unassignedCount}`;
        }

        function renderSpecialSeat() {
            const container = document.getElementById('front-special-seat-container');
            container.innerHTML = '';
            if (students.length >= 1) {
                container.appendChild(createSeatElement('seat-1', 1));
            }
        }

        function renderSeatsGrid() {
            const gridEl = document.getElementById('seats-grid');
            gridEl.innerHTML = '';

            const totalStudents = students.length;
            if (totalStudents <= 1) return;

            let currentSeatIndex = 2;
            const remainingCount = totalStudents - 1;
            const fullRowsCount = Math.floor(remainingCount / 6);
            const extraCount = remainingCount % 6;

            for (let r = 0; r < fullRowsCount; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex justify-center gap-4 w-full';

                for (let group = 0; group < 3; group++) {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'flex gap-2 bg-slate-200/60 p-1.5 rounded-lg border border-slate-300 shadow-sm';

                    for (let i = 0; i < 2; i++) {
                        if (currentSeatIndex <= totalStudents) {
                            const seatId = `seat-${currentSeatIndex}`;
                            groupDiv.appendChild(createSeatElement(seatId, currentSeatIndex));
                            currentSeatIndex++;
                        }
                    }
                    rowDiv.appendChild(groupDiv);
                }
                gridEl.appendChild(rowDiv);
            }

            if (extraCount > 0) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex justify-center gap-3 w-full';
                
                for (let group = 0; group < 3; group++) {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'flex gap-2 bg-slate-200/50 p-1.5 rounded-lg border border-slate-300';
                    
                    let groupHasSeat = false;
                    for (let i = 0; i < 2; i++) {
                        if (currentSeatIndex <= totalStudents) {
                            const seatId = `seat-${currentSeatIndex}`;
                            groupDiv.appendChild(createSeatElement(seatId, currentSeatIndex));
                            currentSeatIndex++;
                            groupHasSeat = true;
                        } else {
                            const emptyPlaceholder = document.createElement('div');
                            emptyPlaceholder.className = 'w-28 h-16 opacity-0 pointer-events-none';
                            groupDiv.appendChild(emptyPlaceholder);
                        }
                    }
                    if (groupHasSeat) {
                        rowDiv.appendChild(groupDiv);
                    }
                }
                gridEl.appendChild(rowDiv);
            }
        }

        function createSeatElement(seatId, seatNumber) {
            const slot = document.createElement('div');
            // 加寬至 w-28 讓名字與座號更寬裕，絕不被裁切
            slot.className = 'seat-slot w-28 h-16 bg-white border-2 border-slate-300 rounded-lg p-1.5 flex flex-col justify-between items-center shadow-sm relative cursor-pointer hover:border-blue-400';
            slot.dataset.seatId = seatId;

            slot.ondragover = (e) => { e.preventDefault(); slot.classList.add('drag-over'); };
            slot.ondragleave = (e) => { slot.classList.remove('drag-over'); };
            slot.ondrop = (e) => {
                e.preventDefault();
                slot.classList.remove('drag-over');
                const sId = parseInt(e.dataTransfer.getData('text/plain'));
                assignStudentToSeat(sId, seatId);
            };

            const studentIdInSeat = seatingAssignments[seatId];
            const assignedStudent = students.find(s => s.id === studentIdInSeat);

            if (assignedStudent) {
                const genderColor = assignedStudent.gender === '男' ? 'text-blue-600' : 'text-rose-600';
                slot.innerHTML = `
                    <div class="flex justify-between w-full text-[10px] px-1">
                        <span class="text-slate-400 font-bold">#${seatNumber}</span>
                        <button onclick="removeStudentFromSeat('${seatId}')" class="text-slate-400 hover:text-rose-600 font-bold">×</button>
                    </div>
                    <div class="text-xs font-bold text-slate-800 truncate px-1">${assignedStudent.name}</div>
                    <div class="text-[10px] ${genderColor}">${assignedStudent.gender}</div>
                `;
                slot.draggable = true;
                slot.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', assignedStudent.id);
                    assignStudentToSeat(null, seatId);
                };
            } else {
                slot.innerHTML = `
                    <div class="flex justify-between w-full text-[10px] px-1">
                        <span class="text-slate-400 font-bold">#${seatNumber}</span>
                    </div>
                    <div class="text-[11px] text-slate-300 italic my-auto">空座位</div>
                    <div></div>
                `;
            }

            return slot;
        }

        function assignStudentIdToSeat(studentId, seatId) {
            for (let s in seatingAssignments) {
                if (seatingAssignments[s] === studentId) {
                    seatingAssignments[s] = null;
                }
            }
            seatingAssignments[seatId] = studentId;
            saveToLocalStorage();
            renderAll();
        }

        function assignStudentToSeat(studentId, seatId) {
            assignStudentIdToSeat(studentId, seatId);
        }

        function removeStudentFromSeat(seatId) {
            seatingAssignments[seatId] = null;
            saveToLocalStorage();
            renderAll();
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function removeDropStyle(e) {}

        function dropToPool(e) {
            e.preventDefault();
            const studentId = parseInt(e.dataTransfer.getData('text/plain'));
            for (let s in seatingAssignments) {
                if (seatingAssignments[s] === studentId) {
                    seatingAssignments[s] = null;
                }
            }
            saveToLocalStorage();
            renderAll();
        }

        function autoAssign() {
            initAssignments();
            renderAll();
        }

        function clearSeats() {
            for (let s in seatingAssignments) {
                seatingAssignments[s] = null;
            }
            saveToLocalStorage();
            renderAll();
        }

        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                elmnt.style.zIndex = 100;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;

                const canvas = document.getElementById('classroom-canvas');
                let newTop = elmnt.offsetTop - pos2;
                let newLeft = elmnt.offsetLeft - pos1;

                if (newTop < 0) newTop = 0;
                if (newLeft < 0) newLeft = 0;
                if (newTop + elmnt.offsetHeight > canvas.clientHeight) newTop = canvas.clientHeight - elmnt.offsetHeight;
                if (newLeft + elmnt.offsetWidth > canvas.clientWidth) newLeft = canvas.clientWidth - elmnt.offsetWidth;

                elmnt.style.top = newTop + "px";
                elmnt.style.left = newLeft + "px";

                teacherPos = { top: newTop, left: newLeft };
                saveToLocalStorage();
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                elmnt.style.zIndex = 20;
            }
        }

        makeDraggable(document.getElementById('canvas-teacher'));

        function exportImage() {
            const canvasElement = document.getElementById('classroom-canvas');
            html2canvas(canvasElement, { 
                scale: 2,
                useCORS: true,
                logging: false,
                windowWidth: canvasElement.scrollWidth,
                windowHeight: canvasElement.scrollHeight
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '教室座位圖.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>

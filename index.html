<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室座位圖設計工具 (Classroom Seating Planner)</title>
    <!-- 引入 Tailwind CSS 與 html2canvas 以便匯出圖片 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .seat-card {
            cursor: grab;
            user-select: none;
            touch-action: none;
            position: absolute;
        }
        .seat-card:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 text-white shadow px-6 py-3 flex justify-between items-center">
        <h1 class="text-lg font-bold flex items-center gap-2">
            🏫 教室座位圖設計工具 (Classroom Seating Planner)
        </h1>
        <div class="flex gap-3">
            <button onclick="exportImage()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded text-sm font-medium flex items-center gap-1 shadow transition">
                📥 匯出圖片
            </button>
            <button onclick="resetLayout()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded text-sm font-medium flex items-center gap-1 shadow transition">
                🔄 重新排列
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- 左側控制面板 -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col p-4 gap-4 overflow-y-auto">
            
            <!-- 步驟 1：設定導師位置 -->
            <div class="border border-slate-200 rounded-lg p-3 shadow-sm bg-slate-50">
                <h2 class="font-bold text-slate-700 text-sm mb-2">1. 設定導師位置</h2>
                <div class="flex items-center gap-2">
                    <div id="teacher-preset" class="bg-amber-100 border border-amber-300 rounded p-2 text-center cursor-pointer text-xs font-semibold w-24 shadow-sm hover:bg-amber-200 transition">
                        👨‍🏫 導師桌
                    </div>
                    <span class="text-xs text-slate-500">（可直接拖曳至畫布任意處）</span>
                </div>
            </div>

            <!-- 步驟 2：設定學生數量 -->
            <div class="border border-slate-200 rounded-lg p-3 shadow-sm bg-slate-50">
                <h2 class="font-bold text-slate-700 text-sm mb-2">2. 設定學生數量</h2>
                <div class="flex items-center gap-2">
                    <label class="text-sm text-slate-600">學生人數：</label>
                    <input type="number" id="student-count" min="1" max="50" value="26" class="w-20 border border-slate-300 rounded px-2 py-1 text-sm text-center">
                    <button onclick="generateSeats()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-sm font-medium transition">
                        確認生成
                    </button>
                </div>
            </div>

            <!-- 步驟 3：設定學生資訊 -->
            <div class="border border-slate-200 rounded-lg p-3 shadow-sm bg-slate-50 flex-1 flex flex-col">
                <h2 class="font-bold text-slate-700 text-sm mb-2">3. 設定學生資訊</h2>
                <p class="text-xs text-slate-500 mb-2">在此可直接修改各座號對應的學生姓名與性別：</p>
                <div id="student-list-inputs" class="flex flex-col gap-2 overflow-y-auto flex-1 max-h-72 pr-1">
                    <!-- 動態生成輸入框 -->
                </div>
            </div>

        </aside>

        <!-- 右側互動畫布區 -->
        <main class="flex-1 p-6 flex flex-col items-center justify-center overflow-auto relative">
            
            <!-- 教室畫布外框 -->
            <div id="classroom-canvas" class="w-[900px] h-[650px] bg-amber-50 border-4 border-slate-700 rounded-xl relative shadow-2xl overflow-hidden">
                
                <!-- 黑板 -->
                <div class="absolute top-4 left-1/2 transform -translate-x-1/2 w-3/5 h-12 bg-slate-800 border-4 border-amber-900 rounded flex items-center justify-center text-white font-bold shadow-md tracking-widest text-sm">
                    黑 板 (Whiteboard)
                </div>

                <!-- 講台裝飾 -->
                <div class="absolute top-20 left-1/2 transform -translate-x-1/2 w-40 h-8 bg-amber-800 rounded shadow flex items-center justify-center text-white text-xs font-semibold">
                    講台
                </div>

                <!-- 導師桌圖塊 -->
                <div id="teacher-seat" class="seat-card bg-amber-200 border-2 border-amber-500 rounded-lg p-2 text-center shadow-md w-28" style="top: 80px; left: 50px;">
                    <div class="text-xs font-bold text-amber-900">👨‍🏫 導師桌</div>
                </div>

                <!-- 學生座位容器 -->
                <div id="students-container">
                    <!-- 動態學生座位會生成在此 -->
                </div>

            </div>
        </main>
    </div>

    <!-- 程式邏輯互動 -->
    <script>
        let studentData = [];
        const defaultNames = [
            "陳小明", "李美玲", "林志豪", "王曉華", "張偉誠", "黃淑芬", "吳建宏", "蔡依婷", 
            "賴俊傑", "許雅婷", "郭志偉", "鄭雅萍", "謝佳豪", "曾怡君", "潘信宏", "洪秀貞", 
            "彭俊宇", "江佩芬", "傅建志", "方淑君", "曾國華", "呂佳穎", "戴志豪", "邱美琪", 
            "莊雅雯", "柯志明", "葉美玲", "袁家豪", "夏郁婷", "羅建安"
        ];

        // 初始化生成預設學生
        function initStudents() {
            const count = parseInt(document.getElementById('student-count').value) || 26;
            studentData = [];
            for (let i = 1; i <= count; i++) {
                const name = defaultNames[(i - 1) % defaultNames.length];
                const gender = (i % 2 === 0) ? '女' : '男';
                studentData.push({ id: i, name: name, gender: gender });
            }
            renderInputs();
            renderSeats();
        }

        // 渲染左側輸入清單
        function renderInputs() {
            const container = document.getElementById('student-list-inputs');
            container.innerHTML = '';
            studentData.forEach((s, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-1 bg-white p-1.5 rounded border border-slate-200 text-xs';
                div.innerHTML = `
                    <span class="w-8 font-bold text-slate-500">A${String(s.id).padStart(2, '0')}</span>
                    <input type="text" value="${s.name}" oninput="updateStudent(${index}, 'name', this.value)" class="flex-1 border rounded px-1 py-0.5">
                    <select onchange="updateStudent(${index}, 'gender', this.value)" class="border rounded px-1 py-0.5">
                        <option value="男" ${s.gender === '男' ? 'selected' : ''}>男</option>
                        <option value="女" ${s.gender === '女' ? 'selected' : ''}>女</option>
                    </select>
                `;
                container.appendChild(div);
            });
        }

        function updateStudent(index, field, value) {
            studentData[index][field] = value;
            renderSeats();
        }

        // 渲染右側座位圖塊
        function renderSeats() {
            const container = document.getElementById('students-container');
            // 保留已經拖曳過的位置，如果沒有則賦予預設矩陣排列
            const existingCards = {};
            document.querySelectorAll('.student-seat').forEach(el => {
                existingCards[el.dataset.id] = {
                    left: el.style.left,
                    top: el.style.top
                };
            });

            container.innerHTML = '';

            let cols = 5; // 每行5個座位
            let startX = 80;
            let startY = 160;
            let gapX = 140;
            let gapY = 85;

            studentData.forEach((s, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const defaultLeft = startX + (col * gapX) + 'px';
                const defaultTop = startY + (row * gapY) + 'px';

                const pos = existingCards[s.id] || { left: defaultLeft, top: defaultTop };

                const card = document.createElement('div');
                card.className = 'seat-card student-seat bg-white border-2 border-slate-300 rounded-lg p-2 text-center shadow-md w-28 hover:border-blue-400 transition-colors';
                card.dataset.id = s.id;
                card.style.left = pos.left;
                card.style.top = pos.top;

                const genderColor = s.gender === '男' ? 'text-blue-600' : 'text-rose-600';

                card.innerHTML = `
                    <div class="text-[10px] font-semibold text-slate-400">A${String(s.id).padStart(2, '0')}</div>
                    <div class="text-xs font-bold text-slate-800 truncate">${s.name}</div>
                    <div class="text-[10px] ${genderColor}">${s.gender}</div>
                `;

                makeDraggable(card);
                container.appendChild(card);
            });
        }

        // 重新排列（重設回整齊陣列）
        function resetLayout() {
            // 重置導師桌位置
            const teacherSeat = document.getElementById('teacher-seat');
            teacherSeat.style.left = '50px';
            teacherSeat.style.top = '80px';
            renderSeats();
        }

        // 點擊按鈕確認生成
        function generateSeats() {
            initStudents();
        }

        // 拖曳功能實作 (支援滑鼠與觸控)
        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                // 提高被拖曳圖塊的層級
                elmnt.style.zIndex = 1000;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;

                const canvas = document.getElementById('classroom-canvas');
                const rect = canvas.getBoundingClientRect();

                let newTop = elmnt.offsetTop - pos2;
                let newLeft = elmnt.offsetLeft - pos1;

                // 限制在畫布範圍內
                if (newTop < 0) newTop = 0;
                if (newLeft < 0) newLeft = 0;
                if (newTop + elmnt.offsetHeight > canvas.clientHeight) newTop = canvas.clientHeight - elmnt.offsetHeight;
                if (newLeft + elmnt.offsetWidth > canvas.clientWidth) newLeft = canvas.clientWidth - elmnt.offsetWidth;

                elmnt.style.top = newTop + "px";
                elmnt.style.left = newLeft + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                elmnt.style.zIndex = 1;
            }
        }

        // 讓導師桌也能拖曳
        makeDraggable(document.getElementById('teacher-seat'));

        // 匯出圖片功能
        function exportImage() {
            const canvasElement = document.getElementById('classroom-canvas');
            html2canvas(canvasElement, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = '教室座位圖.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 網頁載入時初始化
        window.onload = function() {
            initStudents();
        };
    </script>
</body>
</html>
